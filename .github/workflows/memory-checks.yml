name: memory-checks
# No path filter: the scrub tests read every tracked file and the scaffold test packs the whole repo,
# so any change can break them.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # contributor CI: a "Use this template" copy carries this file, and the scrub would fail on its
    # owner's first real card, so it runs only in the upstream repository
    if: github.repository == 'kylnor/lararium'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the frontmatter test parses with real PyYAML and fails (not skips) when CI cannot find it
      - run: pip install pyyaml
      # the memory server tests drive the real MCP SDK, installed from the lockfile
      - run: npm ci --prefix npx
      - run: node --test hooks/memory-check.test.mjs hooks/memory-loop.test.mjs hooks/memory-pointers.test.mjs hooks/memory-cards.test.mjs tests/persona-scrub.test.mjs tests/agent-defs.test.mjs tests/scaffold.test.mjs tests/workflows.test.mjs tests/docs.test.mjs tests/serve-guard.test.mjs tests/serve-store.test.mjs tests/serve-http.test.mjs tests/serve-stdio.test.mjs tests/serve-embed.test.mjs
